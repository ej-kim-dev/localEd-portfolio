<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>localEd architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334;stroke-width:1.2}
      .ext{fill:#eef4ff;stroke:#3b5b99;stroke-width:1.2}
      .new{fill:#fff7e0;stroke:#b07a00;stroke-width:1.5;stroke-dasharray:5 3}
      .zone{fill:#f6f7f9;stroke:#99a;stroke-width:1;stroke-dasharray:4 4}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:11.5px;fill:#334}
      .ln{stroke:#334;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <!-- External: Google Workspace -->
  <rect class="ext" x="20" y="40" width="200" height="250" rx="8"/>
  <text class="h" x="35" y="64">Google Workspace</text>
  <text class="s" x="35" y="84">(the only external service)</text>
  <rect class="box" x="35" y="100" width="170" height="50" rx="6"/>
  <text x="45" y="121" class="h">Google Chat</text>
  <text x="45" y="139" class="s">teacher sends a request</text>
  <rect class="box" x="35" y="165" width="170" height="50" rx="6"/>
  <text x="45" y="186" class="h">Pub/Sub (pull)</text>
  <text x="45" y="204" class="s">no inbound ports needed</text>
  <rect class="box" x="35" y="230" width="170" height="50" rx="6"/>
  <text x="45" y="251" class="h">Drive / Docs / Sheets</text>
  <text x="45" y="269" class="s">allow-listed folders only</text>

  <!-- On-premise zone -->
  <rect class="zone" x="250" y="20" width="730" height="600" rx="10"/>
  <text class="h" x="265" y="44">On-premise: one Mac Studio in the school (M4 Max, 36 GB). All models run here.</text>

  <rect class="box" x="265" y="60" width="300" height="78" rx="6"/>
  <text x="277" y="81" class="h">Chat dispatcher + job runner</text>
  <text x="277" y="99" class="s">domain check · "On it" reply · background jobs</text>
  <text x="277" y="115" class="s">retries · dedupe · per-teacher short-term memory</text>
  <text x="277" y="131" class="s">(in memory only, never written to disk)</text>

  <rect class="box" x="600" y="60" width="365" height="78" rx="6"/>
  <text x="612" y="81" class="h">Agent loop (local LLM, tool calling)</text>
  <text x="612" y="99" class="s">Qwen via Ollama chooses tools; safety rules stay in code:</text>
  <text x="612" y="115" class="s">citations renumbered/validated, quotes checked word-for-word,</text>
  <text x="612" y="131" class="s">re-prompt if it claims an action no tool performed</text>

  <!-- tools row -->
  <rect class="box" x="265" y="170" width="220" height="150" rx="6"/>
  <text x="277" y="191" class="h">Document knowledge base</text>
  <text x="277" y="209" class="s">Docs/Sheets/Slides, PDF (+OCR),</text>
  <text x="277" y="225" class="s">DOCX/PPTX/XLSX/HWPX, legacy</text>
  <text x="277" y="241" class="s">HWP/DOC/XLS/PPT, images (OCR),</text>
  <text x="277" y="257" class="s">recordings (ASR)</text>
  <text x="277" y="277" class="s">→ chunks → bge-m3 embeddings</text>
  <text x="277" y="293" class="s">→ SQLite (FTS5 + vectors)</text>
  <text x="277" y="309" class="s">→ hybrid search, numbered sources</text>

  <rect class="box" x="500" y="170" width="220" height="150" rx="6"/>
  <text x="512" y="191" class="h">Recording pipeline</text>
  <text x="512" y="209" class="s">ffmpeg decode → Whisper (MLX)</text>
  <text x="512" y="225" class="s">word timestamps</text>
  <text x="512" y="241" class="s">→ teacher-Q&amp;A detection (LLM)</text>
  <text x="512" y="257" class="s">→ diarization (sherpa-onnx)</text>
  <text x="512" y="273" class="s">→ self-introduced names only</text>
  <text x="512" y="293" class="s">audio deleted after decoding</text>

  <rect class="box" x="735" y="170" width="230" height="150" rx="6"/>
  <text x="747" y="191" class="h">Rubric evidence for teachers</text>
  <text x="747" y="209" class="s">rubric loaded from a file</text>
  <text x="747" y="225" class="s">drafted 3× per criterion, median kept</text>
  <text x="747" y="241" class="s">quotes verified against transcript</text>
  <text x="747" y="257" class="s">marks clamped to the rubric</text>
  <text x="747" y="277" class="s">labelled "AI-SUGGESTED,</text>
  <text x="747" y="293" class="s">PENDING TEACHER REVIEW"</text>

  <!-- proposed -->
  <rect class="new" x="735" y="345" width="230" height="120" rx="6"/>
  <text x="747" y="366" class="h">Proposed next step</text>
  <text x="747" y="384" class="s">table-aware rubric extraction</text>
  <text x="747" y="400" class="s">with cell-level sources,</text>
  <text x="747" y="416" class="s">validation, and teacher approval</text>
  <text x="747" y="432" class="s">before the rubric can be used</text>
  <text x="747" y="452" class="s" font-style="italic">(demo/ in this repository)</text>

  <!-- cross-cutting -->
  <rect class="box" x="265" y="345" width="455" height="120" rx="6"/>
  <text x="277" y="366" class="h">Safety and operations (cross-cutting)</text>
  <text x="277" y="386" class="s">• access: Drive allow-list; knowledge folders read-only; one results folder</text>
  <text x="277" y="404" class="s">• logs hold counts, timings and error types only (never student content)</text>
  <text x="277" y="422" class="s">• anonymized per-job run log (salted teacher hash) for monitoring</text>
  <text x="277" y="440" class="s">• launchd service; update script runs tests before restarting</text>
  <text x="277" y="458" class="s">• evaluation module: WER/CER, speaker attribution, key terms</text>

  <rect class="box" x="265" y="490" width="700" height="110" rx="6"/>
  <text x="277" y="511" class="h">Outputs written back to Drive</text>
  <text x="277" y="531" class="s">cited answers in Chat · speaker-labelled transcript Doc + timestamped Sheet · AI-suggested feedback Doc</text>
  <text x="277" y="549" class="s">· drafts saved as Google Docs, shared only with the requesting teacher</text>
  <text x="277" y="575" class="s" font-style="italic">Not yet validated: transcription accuracy against human references, speaker attribution,</text>
  <text x="277" y="591" class="s" font-style="italic">agreement with teachers' judgments, Korean recordings. See docs/evidence.md.</text>

  <!-- arrows -->
  <path class="ln" d="M120 150 L120 165"/>
  <path class="ln" d="M205 190 C235 190 240 100 265 100"/>
  <path class="ln" d="M565 99 L600 99"/>
  <path class="ln" d="M700 138 L375 170"/>
  <path class="ln" d="M760 138 L610 170"/>
  <path class="ln" d="M830 138 L850 170"/>
  <path class="ln" d="M850 345 L850 320"/>
  <path class="ln" d="M265 545 C230 545 230 255 205 255"/>
  <path class="ln" d="M205 245 C232 245 240 240 265 240"/>
</svg>
