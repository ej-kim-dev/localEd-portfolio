name: demo-tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Korean test text on Windows consoles
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (includes the benchmark)
        run: python -m unittest discover -s tests -v
      - name: Demo end to end
        run: python -m rubric_pipeline demo
      - name: Benchmark report
        run: python -m benchmark.run
